services:
  mysql:
    image: mysql:8.0
    container_name: cafe-mysql
    environment:
      MYSQL_DATABASE: cafe_db
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - cafe-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  cafe-mysql-data: